version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: pyspark
        update-types: ["version-update:semver-major"]
      - dependency-name: delta-spark
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
